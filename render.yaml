# Render Blueprint for Lookbook
# This file allows you to deploy the entire stack with one click
# Using existing segundo-db database

services:
  # Backend API
  - type: web
    name: lookbook-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4002
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPLOADS_ROOT
        value: /var/data/uploads
      # Secret URL segment that enables the remote MCP connector at /mcp/<secret>.
      # Set to a long random string in the Render dashboard. Leave unset to disable.
      - key: MCP_SECRET
        sync: false
    disks:
      - name: lookbook-uploads
        mountPath: /var/data
        sizeGB: 5
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: lookbook-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

